# lint + tests on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6        # installs uv
        with:
          enable-cache: true                # reuse downloaded packages next time
      - run: uv sync --frozen               # python 3.12 + the exact versions from uv.lock
      - run: uv run ruff check backend scripts
      - run: uv run pytest backend/tests -q # sqlite + fake ai, no secrets needed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

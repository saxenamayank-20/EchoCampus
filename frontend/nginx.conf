# any page path (like /admin/users) gets index.html, react router picks the page
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # nginx doesn't know .webmanifest, give it the right type for "install app"
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
